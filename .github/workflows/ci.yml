name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: Lint y build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      # Un ID de modelo inexistente compila igual y rompe en producción.
      - name: Comprobar que los modelos existen en OpenRouter
        run: npm run check:models

      # El build no necesita secretos: todas las páginas que tocan la base de
      # datos son dinámicas y la conexión se abre en tiempo de ejecución.
      - name: Build
        run: npm run build
